<!DOCTYPE html>
<html lang="en" class="page-loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#4b0710" />
<meta name="description" content="The wedding invitation of Prince and Preksha — 26 November 2026." />
<title>Prince & Preksha | Wedding Invitation</title>
<style>
  :root {
    --wine: #4b0710;
    --wine-deep: #30040a;
    --wine-light: #681522;
    --ivory: #fff4df;
    --champagne: #e8cb88;
    --gold: #c7a15b;
    --gold-soft: rgba(232,203,136,.5);
    --silk: #f7e9ce;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; background: var(--wine-deep); }
  body {
    margin: 0;
    color: var(--ivory);
    font-family: 'Cormorant Garamond', 'Palatino Linotype', Georgia, serif;
    background:
      radial-gradient(ellipse at 50% 8%, rgba(203,161,91,.13), transparent 33%),
      radial-gradient(ellipse at 10% 42%, rgba(145,49,48,.2), transparent 35%),
      linear-gradient(145deg, #5a101b 0%, var(--wine) 43%, var(--wine-deep) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .invitation {
    width: min(100%, 1000px);
    margin: 0 auto;
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    box-shadow: 0 0 100px rgba(0,0,0,.38);
    animation: page-arrive 1.1s ease both;
  }
  .invitation::before {
    content: '';
    position: absolute;
    z-index: 10;
    pointer-events: none;
    inset: 14px;
    border: 1px solid rgba(232,203,136,.56);
    outline: 1px solid rgba(232,203,136,.18);
    outline-offset: 5px;
    box-shadow: inset 0 0 45px rgba(232,203,136,.035);
  }
  .invitation::after {
    content: ''; position: absolute; inset: 23px; z-index: 10; pointer-events: none;
    border: 1px solid rgba(232,203,136,.14);
  }
  @keyframes page-arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes gold-glow { 0%,100% { opacity: .52; } 50% { opacity: .9; } }
  @keyframes float-in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .hero {
    position: relative;
    overflow: hidden;
    background: var(--wine-deep);
    min-height: 300px;
  }
  .hero-video {
    display: block;
    width: 100%;
    height: clamp(340px, 57vw, 570px);
    object-fit: cover;
    object-position: center 47%;
    opacity: .96;
    filter: saturate(.9) contrast(1.04);
    animation: hero-settle 1.5s ease-out both;
  }
  @keyframes hero-settle { from { transform: scale(1.035); filter: saturate(.7) brightness(.82); } to { transform: scale(1); filter: saturate(.9) contrast(1.04); } }
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(48,4,10,.05) 50%, rgba(48,4,10,.22) 72%, var(--wine) 100%);
  }
  .couple-wrap {
    position: relative;
    height: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
  }
  .couple {
    position: absolute;
    width: clamp(205px, 36vw, 330px);
    max-height: 440px;
    height: auto;
    object-fit: contain;
    top: clamp(-280px, -29vw, -185px);
    transform: translateY(0) scale(1);
    transform-origin: center 70%;
    filter: drop-shadow(0 15px 18px rgba(20,0,0,.3));
    transition: transform .35s ease-out, filter .5s ease;
    animation: float-in 1.15s .25s ease both;
    will-change: transform;
  }
  .details {
    position: relative;
    z-index: 1;
    text-align: center;
    overflow: hidden;
    padding: 0 26px 50px;
    border-top: 1px solid rgba(232,203,136,.22);
    background:
      radial-gradient(ellipse at 50% 4%, rgba(137,39,43,.26), transparent 56%),
      linear-gradient(180deg, var(--wine), var(--wine-deep));
  }
  .details::before {
    content: '✦';
    display: block;
    color: var(--champagne);
    font-size: 13px;
    letter-spacing: .6em;
    opacity: .82;
  }
  .details::before { padding-top: 18px; animation: gold-glow 5s ease-in-out infinite; }
  .invitation-art {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    margin: 150px auto 0;
    object-fit: contain;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,.12));
    animation: float-in 1.2s .2s ease both;
  }
  @media (max-width: 600px) {
    .invitation::before { inset: 9px; outline-offset: 3px; }
    .invitation::after { inset: 15px; }
    .hero { min-height: 250px; }
    .hero-video { height: 300px; object-position: center; }
    .couple { width: 220px; top: -185px; }
    .details { padding: 0 15px 32px; }
    .invitation-art { width: 100%; margin-top: 150px; }
  }
  .music-toggle {
    position: fixed; right: 22px; bottom: 22px; z-index: 30;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 15px; border: 1px solid rgba(232,203,136,.72);
    border-radius: 999px; color: var(--silk); background: rgba(48,4,10,.88);
    backdrop-filter: blur(12px); font: 12px/1.2 Georgia, serif; letter-spacing: .08em;
    box-shadow: 0 8px 28px rgba(0,0,0,.25); cursor: pointer;
    transition: background .25s ease, transform .25s ease;
  }
  .music-toggle:hover { background: rgba(104,21,34,.96); transform: translateY(-2px); }
  .music-toggle .music-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--champagne); box-shadow: 0 0 10px rgba(232,203,136,.8); }
  .music-toggle.is-playing .music-dot { animation: gold-glow 1.5s infinite; }
  @media (max-width: 600px) { .music-toggle { right: 14px; bottom: 14px; padding: 10px 12px; font-size: 11px; } }
  /* Keep the page completely blank until its visual assets are ready. */
  html.page-loading,
  html.page-loading body {
    background: #fff !important;
  }
  html.page-loading body > * {
    visibility: hidden !important;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  /* Luxury click-to-open invitation with left and right paper flaps */
  .invitation-reveal {
    position: relative;
    width: 100%;
    margin: 150px auto 0;
    perspective: 1800px;
    isolation: isolate;
    overflow: clip;
    border-radius: 2px;
  }
  .invitation-reveal .invitation-art {
    display: block; width: 100%; max-width: 100%; height: auto; margin: 0;
    position: relative; z-index: 1; filter: drop-shadow(0 10px 22px rgba(0,0,0,.12));
    animation: none;
  }
  .invitation-cover {
    position: absolute; z-index: 4; inset: 0; display: grid; grid-template-columns: 1fr 1fr;
    border: 1px solid rgba(232,203,136,.88);
    box-shadow: inset 0 0 0 7px rgba(232,203,136,.12), 0 18px 35px rgba(0,0,0,.25);
    cursor: pointer; padding: 0; background: transparent; color: var(--ivory); overflow: visible;
    -webkit-tap-highlight-color: transparent;
  }
  .invitation-cover:focus-visible { outline: 2px solid var(--champagne); outline-offset: 5px; }
  .invitation-flap {
    position: relative; display: flex; align-items: center; justify-content: center; min-width: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(232,203,136,.11), transparent 58%),
      linear-gradient(135deg, #681522, #4b0710 55%, #30040a);
    border: 1px solid rgba(232,203,136,.55); backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 1.35s cubic-bezier(.2,.75,.18,1), box-shadow 1.35s ease;
    will-change: transform;
  }
  .invitation-flap::before {
    content: ""; position: absolute; inset: 16px; border: 1px solid rgba(232,203,136,.62);
    outline: 1px solid rgba(232,203,136,.16); outline-offset: 4px; pointer-events: none;
  }
  .invitation-flap::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(transparent, rgba(232,203,136,.5), transparent); opacity: .65;
  }
  .invitation-flap.left { transform-origin: left center; border-right-color: rgba(232,203,136,.3); box-shadow: inset -18px 0 24px rgba(0,0,0,.12); }
  .invitation-flap.left::after { right: 0; }
  .invitation-flap.right { transform-origin: right center; border-left-color: rgba(232,203,136,.3); box-shadow: inset 18px 0 24px rgba(0,0,0,.12); }
  .invitation-flap.right::after { left: 0; }
  .cover-ornament {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    gap: clamp(8px, 2vw, 18px); padding: 18px 8px; text-align: center; color: var(--champagne);
    text-shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  .cover-monogram { font-size: clamp(22px, 5vw, 54px); line-height: 1; font-style: italic; letter-spacing: .04em; }
  .cover-rule { width: clamp(35px, 8vw, 80px); height: 1px; background: linear-gradient(90deg, transparent, var(--champagne), transparent); }
  .cover-caption { font-size: clamp(8px, 1.3vw, 13px); line-height: 1.7; letter-spacing: .18em; text-transform: uppercase; }
  .cover-open-hint {
    position: absolute; z-index: 6; left: 50%; bottom: clamp(20px, 5vw, 48px); transform: translateX(-50%);
    padding: 10px 16px; border: 1px solid rgba(232,203,136,.65); border-radius: 999px;
    background: rgba(48,4,10,.82); color: var(--ivory); font: 10px/1.2 Georgia, serif;
    letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); transition: opacity .4s ease, transform .4s ease;
  }
  .invitation-reveal.is-open .invitation-flap.left { transform: rotateY(-112deg); box-shadow: inset -18px 0 24px rgba(0,0,0,.02); }
  .invitation-reveal.is-open .invitation-flap.right { transform: rotateY(112deg); box-shadow: inset 18px 0 24px rgba(0,0,0,.02); }
  .invitation-reveal.is-open .cover-open-hint { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
  .invitation-reveal.is-open .invitation-cover { pointer-events: none; border-color: transparent; box-shadow: none; }
  .invitation-reveal.is-open .invitation-flap { pointer-events: none; }
  @media (max-width: 600px) {
    .invitation-reveal { margin-top: 150px; }
    .invitation-flap::before { inset: 9px; outline-offset: 2px; }
    .cover-caption { letter-spacing: .1em; }
  }
  @media (prefers-reduced-motion: reduce) { .invitation-flap { transition-duration: .01ms; } }

  /* Matching image artwork on each invitation flap */
  .invitation-flap .cover-ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 0;
    gap: 0;
  }

  .invitation-flap .flap-art {
    display: block;
    width: 30%;
    height: 30%;
    max-width: 100%;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.12));
  }
</style>
</head>
<body>
<main class="invitation">
<section class="hero" aria-label="Wedding celebration animation">
    <video class="hero-video" autoplay muted loop playsinline poster="image3.png" aria-label="Animated wedding baraat">
      <source src="Video.mp4" type="video/mp4" />
    </video>
  </section>
  <div class="couple-wrap" aria-hidden="true">
    <img class="couple" id="couple" src="Image2.png" alt="" />
  </div>
  <section class="details" aria-label="Wedding invitation">
    <div class="invitation-reveal" id="invitationReveal">
      <img class="invitation-art" src="image3.png" alt="Wedding invitation for Prince and Preksha on Thursday, 26 November 2026, at K Divine Lawns & Convention, Borivali, Mumbai." />
      <button class="invitation-cover" id="invitationCover" type="button" aria-label="Open wedding invitation" aria-expanded="false">
        <span class="invitation-flap left"><span class="cover-ornament"><img class="flap-art" src="image1.png" alt="" /></span></span></span>
        <span class="invitation-flap right"><span class="cover-ornament"><img class="flap-art" src="image1.png" alt="" /></span></span></span>
        <span class="cover-open-hint">Click to open invitation</span>
      </button>
    </div>
  </section>
</main>
<audio id="wedding-music" src="music.mp3" preload="auto" loop></audio>
<script>
(() => {
  const couple = document.getElementById('couple');
  if (!couple || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let scheduled = false;
  const update = () => {
    const y = window.scrollY || 0;
    const scale = Math.min(1.045, 1 + y / 11000);
    couple.style.transform = `translateY(${Math.min(10, y * 0.02)}px) scale(${scale})`;
    scheduled = false;
  };
  window.addEventListener('scroll', () => {
    if (!scheduled) {
      scheduled = true;
      window.requestAnimationFrame(update);
    }
  }, { passive: true });
  update();
})();

// Invitation flap animation + looping instrumental (no music button).
(() => {
  const reveal = document.getElementById('invitationReveal');
  const cover = document.getElementById('invitationCover');
  if (reveal && cover) {
    cover.addEventListener('click', () => {
      reveal.classList.add('is-open');
      cover.setAttribute('aria-expanded', 'true');
    }, { once: true });
  }

  const audio = document.getElementById('wedding-music');
  if (!audio) return;
  audio.loop = true;
  audio.volume = 0.72;
  audio.preload = 'auto';
  const tryPlay = () => {
    if (audio.paused) audio.play().catch(() => {});
  };
  tryPlay();
  ['pointerdown', 'keydown', 'touchstart'].forEach((eventName) => {
    window.addEventListener(eventName, tryPlay, { once: true, passive: true });
  });
})();
</script>


<!-- Reveal the invitation only after its images and media are ready to display. -->
<script>
(() => {
  const root = document.documentElement;
  const images = Array.from(document.images);
  const media = Array.from(document.querySelectorAll('video, audio'));

  const waitForImage = (img) => {
    if (img.complete && img.naturalWidth > 0) {
      return typeof img.decode === 'function' ? img.decode().catch(() => {}) : Promise.resolve();
    }
    return new Promise((resolve) => {
      const finish = () => {
        if (typeof img.decode === 'function' && img.naturalWidth > 0) {
          img.decode().catch(() => {}).finally(resolve);
        } else {
          resolve();
        }
      };
      img.addEventListener('load', finish, { once: true });
      img.addEventListener('error', resolve, { once: true });
    });
  };

  const waitForMedia = (element) => {
    // Video/audio are considered ready when the browser has enough data to begin playback.
    const readyState = element.tagName === 'VIDEO' ? 3 : 3; // HAVE_FUTURE_DATA
    if (element.readyState >= readyState || element.error) return Promise.resolve();
    return new Promise((resolve) => {
      const finish = () => {
        element.removeEventListener('canplay', finish);
        element.removeEventListener('error', finish);
        resolve();
      };
      element.addEventListener('canplay', finish, { once: true });
      element.addEventListener('error', finish, { once: true });
    });
  };

  Promise.all([
    ...images.map(waitForImage),
    ...media.map(waitForMedia)
  ]).then(() => {
    requestAnimationFrame(() => {
      root.classList.remove('page-loading');
    });
  });
})();
</script>

</body>
</html>
